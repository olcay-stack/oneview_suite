functionsDirectory = "/home/user/oneview_suite/ai-sovereignty-scan/netlify/functions"
functionsDirectoryOrigin = "config"
headersOrigin = "config"
redirectsOrigin = "config"
plugins = []

[build]
publish = "/home/user/oneview_suite/ai-sovereignty-scan/dist"
publishOrigin = "config"
commandOrigin = "config"
command = "npm run check-data && npm run build:static"
base = "/home/user/oneview_suite/ai-sovereignty-scan"
functions = "/home/user/oneview_suite/ai-sovereignty-scan/netlify/functions"

[build.environment]
NODE_VERSION = "22"
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[functions]

[functions."*"]
external_node_modules = ["pdfmake", "nodemailer"]
node_bundler = "esbuild"

[[headers]]
for = "/*"

[headers.values]
Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "no-referrer"
Strict-Transport-Security = "max-age=31536000; includeSubDomains"
Cross-Origin-Opener-Policy = "same-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/data/*"

[headers.values]
Cache-Control = "public, max-age=3600"

[[redirects]]
from = "/"
to = "/nl/"
status = 302.0
force = true

[redirects.query]

[redirects.conditions]
Language = ["nl"]

[redirects.headers]

[[redirects]]
from = "/"
to = "/en/"
status = 302.0
force = true

[redirects.query]

[redirects.conditions]

[redirects.headers]